server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permite uploads de hasta 30 MB (el backend acepta 25 MB; dejamos margen
    # para el overhead del multipart). Sin esto, nginx corta a 1 MB y devuelve 413.
    client_max_body_size 30M;

    # DNS resolver de Docker (127.0.0.11) — necesario para resolver hostnames de la red
    # interna en runtime y no fallar al iniciar nginx si el upstream aún no está listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static assets — long cache
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy /api/* al backend Node (red interna Docker)
    # Variable + resolver = DNS lookup en cada request, no al boot
    location /api/ {
        set $backend "naves_backend";
        proxy_pass http://$backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # 120s para que uploads grandes (anteproyecto/proyecto-final) tengan
        # tiempo de subir al backend y de allí a Supabase Storage. Antes era 30s
        # y cortaba subidas medianas/grandes en conexiones lentas.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # index.html NUNCA se cachea, y con él el resto de archivos sin hash
    # (favicon, /decisor-anteproyecto.html, imágenes de public/).
    #
    # index.html es el archivo que dice QUÉ bundle cargar. Los bundles sí se
    # cachean un año porque llevan hash en el nombre, así que un index.html
    # viejo guardado en el navegador apunta a un bundle viejo que el navegador
    # también tiene guardado: el usuario entra tras un despliegue y ve la
    # versión anterior entera hasta que refresca a mano. Con `expires -1`
    # (Cache-Control: no-cache) el navegador revalida en cada carga y basta un
    # 304 para confirmar que no cambió.
    #
    # Se usa `expires` y no `add_header`: add_header en un location REEMPLAZA
    # los del bloque server, y eso nos dejaría esta respuesta sin las cabeceras
    # de seguridad de abajo.
    location = /index.html {
        expires -1;
    }

    # SPA fallback. El último parámetro de try_files es una redirección interna,
    # así que servir index.html por esta vía vuelve a pasar por el location de
    # arriba y hereda su `expires -1`.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    # SAMEORIGIN y no DENY: la herramienta de apoyo del anteproyecto
    # (/decisor-anteproyecto.html) se embebe en un <iframe> del mismo origen y
    # con DENY el navegador se negaba a mostrarla — la pantalla quedaba en
    # blanco o con el error crudo del navegador. Sigue bloqueado el embebido
    # desde cualquier otro dominio, que es lo que protege de clickjacking.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
